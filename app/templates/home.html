{% extends "base.html" %}
{% block body %}
<div class="page-head">
  <div>
    <p class="eyebrow">Studio</p>
    <h1>Your brands</h1>
  </div>
  <a class="btn" href="/brands/new">New brand</a>
</div>
<div class="brand-grid">
{% for b in brands %}
  <div class="card">
    <a href="/brands/{{ b.id }}">{{ b.name }}</a>
    <div class="mut">{{ b.slug }}</div>
  </div>
{% else %}
  <p class="mut">No brands yet. Open a house to start.</p>
{% endfor %}
</div>
{% endblock %}
