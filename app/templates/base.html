<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B0A08">
  <title>{% block title %}Makeo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Makeo</a>
  <nav>
    <a href="/">Home</a>
    {% if user %}
      <span class="who">{{ user.name or user.email }}</span>
      <a href="/logout">Log out</a>
    {% else %}
      <a href="/login">Sign in</a>
      <a href="/signup">Create account</a>
    {% endif %}
  </nav>
</header>
<main>
{% for a in alerts or [] %}
  <div class="alert">{{ a.message }}</div>
{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
